name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vega-renderer-pixi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Pixi renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vega-renderer-pixi
          persist-credentials: false

      - name: Check out Vega
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega
          path: vega-renderer-pixi/.dependencies/vega
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vega-renderer-pixi/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: vega-renderer-pixi
        run: pnpm install --no-frozen-lockfile

      - name: Build Vega protocol
        working-directory: vega-renderer-pixi
        run: pnpm --filter @haneoka/vega-protocol build

      - name: Build Vega core
        working-directory: vega-renderer-pixi
        run: pnpm --filter @haneoka/vega build:core

      - name: Check package
        working-directory: vega-renderer-pixi
        run: pnpm check

      - name: Inspect npm payload
        working-directory: vega-renderer-pixi
        run: pnpm pack --dry-run
